*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;font-size:15px;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#7a0c1e,#b3122b 45%,#14213d);color:#fff;display:flex;align-items:center;gap:8px;padding:3px 8px;min-height:40px;box-shadow:0 2px 8px #0004}
header img{width:32px;height:32px;border-radius:8px;background:#fff2}
header .t{flex:1;line-height:1.1;min-width:0}
header .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t small{font-size:11px;opacity:.95}
header .t small i{font-style:normal;color:var(--gold2);font-weight:700;text-shadow:0 0 6px #f2b70088}
.hb{background:#ffffff22;border:0;color:#fff;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer}
#wx{background:linear-gradient(120deg,#1d3b78,#2a5fb0 60%,#3f8bd8);color:#fff;padding:6px 8px}
#wx .now{display:flex;align-items:center;gap:10px}
#wx .big{font-size:34px;font-weight:700;line-height:1}
#wx .days{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:3px}
#wx .d{flex:0 0 auto;min-width:62px;background:#ffffff22;border-radius:10px;padding:4px 6px;text-align:center;font-size:12px}
#wx .d b{display:block}
#btnToday{display:block;width:100%;margin:6px 0 0;background:linear-gradient(135deg,var(--gold),var(--orange));color:#2b1b00;border:0;border-radius:22px;padding:9px 14px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 3px 8px #0005}
#alert{background:#fff1c9;border-bottom:2px solid var(--gold);padding:6px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
#alert a{font-weight:700}
nav#tabs{position:sticky;top:40px;z-index:40;background:#fff;display:flex;gap:6px;overflow-x:auto;padding:6px;box-shadow:0 2px 6px #0002}
nav#tabs button{flex:0 0 auto;border:0;border-radius:20px;padding:7px 12px;background:#eee;font-weight:600;cursor:pointer;white-space:nowrap}
nav#tabs button.on{color:#fff;box-shadow:0 2px 6px #0004}
main{padding:8px;max-width:980px;margin:auto;padding-bottom:70px}
h2{margin:6px 0;font-size:19px;color:var(--red)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.chip{border:1px solid #ddd;background:#fff;border-radius:16px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{border:0;border-radius:10px;padding:7px 11px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;font-size:13px}
.btn.r{background:var(--red)}.btn.g{background:var(--ok)}.btn.o{background:var(--orange)}.btn.l{background:#e8edf5;color:var(--navy)}.btn.gold{background:var(--gold);color:#2b1b00}
.btn.sm{padding:4px 8px;font-size:12px}
input[type=text],input[type=search],input[type=number],select,textarea{border:1px solid #cfd6e4;border-radius:9px;padding:7px 9px;background:#fff;max-width:100%}
textarea{width:100%;min-height:60px}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px #0002;margin:10px 0;overflow:hidden;border-inline-start:5px solid var(--c,var(--red))}
.card.hid{opacity:.5}
.card .ph{height:150px;background:linear-gradient(135deg,var(--c,#b3122b),#14213d);display:flex;align-items:center;justify-content:center;font-size:54px;color:#fff;position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card .ph small{position:absolute;bottom:2px;left:4px;background:#0008;color:#fff;font-size:10px;padding:1px 5px;border-radius:6px}
.card .bd{padding:8px 10px}
.card h3{margin:0;font-size:17px}
.card h3 span{display:block;font-size:12px;color:var(--mut);font-weight:400;direction:ltr;text-align:right}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}
.meta span{background:#f1f4fa;border-radius:12px;padding:2px 8px;font-size:12px}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.more{display:none;border-top:1px dashed #ddd;margin-top:8px;padding-top:6px;font-size:14px}
.more.on{display:block}
.more dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.more dt{font-weight:700;color:var(--navy)}.more dd{margin:0}
.stars span{cursor:pointer;font-size:20px;color:#ccc}.stars span.on{color:var(--gold)}
.warn{background:#ffe3e3;border-inline-start:4px solid var(--red2);padding:6px 9px;border-radius:8px;margin:6px 0;font-size:13px}
.info{background:#e6f1ff;border-inline-start:4px solid var(--blue);padding:6px 9px;border-radius:8px;margin:6px 0;font-size:13px}
.map{height:46vh;min-height:300px;border-radius:12px;border:2px solid var(--navy);position:relative;z-index:1}
.map.full,.mapwrap.full{position:fixed!important;inset:0;height:100vh!important;z-index:900;border-radius:0;background:#fff}
.mapwrap.full .map{height:calc(100vh - 46px)}
.mapwrap .fsb{display:none}.mapwrap.full .fsb{display:flex;position:relative;z-index:901;background:#fff;padding:4px}
.mk{font-size:20px;text-align:center;line-height:26px;background:#fff;border:2px solid var(--c,#b3122b);border-radius:50%;width:30px;height:30px;box-shadow:0 1px 4px #0006}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:10px;overflow:hidden}
table.t th{background:var(--navy);color:#fff;padding:6px}
table.t td{padding:6px;border-bottom:1px solid #eee;vertical-align:middle}
.ru{direction:ltr;unicode-bidi:isolate;font-weight:600}
.lg{display:flex;align-items:center;gap:6px;margin:3px 0}
.lg i{display:inline-block;width:26px;height:10px;border-radius:5px}
.modal{position:fixed;inset:0;background:#000a;z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:12px}
.modal h3{margin:0 0 8px;color:var(--red)}
.fld{display:block;margin:7px 0}.fld>b{display:block;font-size:13px;margin-bottom:2px}
.fld input[type=text],.fld select,.fld textarea{width:100%}
.dtw{display:flex;gap:4px}.dtw input{flex:1;text-align:right;direction:ltr}
.cal{position:fixed;inset:0;background:#0007;z-index:1200;display:flex;align-items:center;justify-content:center}
.cal>div{background:#fff;border-radius:16px;padding:10px;width:min(330px,94vw)}
.cal .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .g b{font-size:12px;color:var(--mut)}
.cal .g button{border:0;border-radius:8px;background:#f1f4fa;padding:8px 0;cursor:pointer}
.cal .g button.t{background:var(--gold)}.cal .g button.s{background:var(--red);color:#fff}
.day{background:#fff;border-radius:12px;margin:10px 0;box-shadow:0 2px 8px #0002;overflow:hidden}
.day>h4{margin:0;padding:7px 10px;color:#fff;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.stop{display:flex;gap:8px;padding:7px 10px;border-bottom:1px solid #eee;align-items:flex-start}
.stop .n{background:var(--navy);color:#fff;border-radius:50%;min-width:24px;height:24px;text-align:center;line-height:24px;font-size:12px}
.fab{position:fixed;bottom:12px;left:12px;z-index:60;display:flex;gap:6px}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:18px;z-index:2000;display:none;max-width:90vw;text-align:center}
#dup{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:3000;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:20px}
.sec{background:linear-gradient(90deg,var(--c,#b3122b),#14213d);color:#fff;padding:6px 10px;border-radius:10px;margin:12px 0 4px;font-weight:700}
@media print{header,#wx,#alert,nav,.fab,.acts,.btn,.bar,.noprint{display:none!important}body{background:#fff}.day{box-shadow:none;border:1px solid #ccc;break-inside:avoid}.map{display:none}}

function genRoute(p){const all=items('map').filter(s=>!S.hidden[s.id]&&s.ll);const hotel=p.hotel.ll;const cap=({relax:3,normal:4,fast:5})[p.pace]-((p.kids||p.seniors)?1:0);const used=new Set(),out=[];
 const rank=id=>all.findIndex(s=>s.id===id);const sc=(s,wx)=>{let v=30-rank(s.id)*1.1;if(p.interests.includes(s.cat))v+=12;if(p.kids){if(s.cat==='מוזיאון')v-=5;if(['טבע ופארקים','חוויות'].includes(s.cat))v+=5}if(wx&&(wx.code>=51||wx.tmax<-10))v+=s.indoor?6:-8;return v};
 const maxT=p.pace==='relax'?300:p.pace==='fast'?600:420;
 for(let d=0;d<p.days;d++){const iso=addDays(p.start,d),wd=wdOf(iso),wx=wxFor(iso);const cand=all.filter(s=>!used.has(s.id)&&!(s.closed||[]).includes(wd));if(!cand.length)break;cand.sort((a,b)=>sc(b,wx)-sc(a,wx));
  const first=cand[0],day=[first];let tot=first.dur||60;used.add(first.id);
  while(day.length<cap){const last=day[day.length-1];const near=cand.filter(s=>!used.has(s.id)&&km(s.ll,first.ll)<(p.lessWalk?5:9)&&tot+(s.dur||60)<=maxT).sort((a,b)=>(sc(b,wx)-km(b.ll,last.ll)*3)-(sc(a,wx)-km(a.ll,last.ll)*3));if(!near.length)break;day.push(near[0]);used.add(near[0].id);tot+=near[0].dur||60}
